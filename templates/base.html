<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .filter-box {
            position: sticky;
            top: 80px;
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .book-card:hover {
            transform: scale(1.03);
            transition: 0.2s;
        }
    </style>
</head>

<body>

<!-- ✅ NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <h4 class="text-white">📚 Book Store</h4>

    <form class="d-flex" method="GET" action="/search">
        <input class="form-control me-2" type="search" name="query" placeholder="Search books...">
        <button class="btn btn-outline-light">Search</button>
    </form>
</nav>

<div class="container mt-4">
    <div class="row">

        <!--  FILTER -->
        <div class="col-md-3 col-lg-2">
            <div class="filter-box shadow-sm">

                <button class="btn btn-primary w-100 mb-3"
                        data-bs-toggle="collapse"
                        data-bs-target="#filterBox">
                    Filters
                </button>

                <div class="collapse show" id="filterBox">
                    <form method="GET" action="/filter">

                        <label>Genre</label>
                        <select  class="form-select mb-3" name="genre">
                            <option value="">All</option>
                            <option value="Travel">Travel</option>
                            <option value="Mystery">Mystery</option>
                            <option value="Historical">Historical</option>
                            <option value="Sequential Art">Sequential Art</option>
                            <option value="Classics">Classics</option>
                            <option value="Philosophy">Philosophy</option>
                            <option value="Romance">Romance</option>
                            <option value="Spirituality">Spirituality</option>
                            
                        </select>

                        <label>Max Price</label>
                        <input type="number" class="form-control mb-3" name="price">

                        <label>Rating</label>
                        <select class="form-select mb-3" name="rating">
                            <option value="">All</option>
                            <option value="1">1 Star</option>
                            <option value="2">2 Star</option>
                            <option value="3">3 Star</option>
                            <option value="4">4 Star</option>
                            <option value="5">5 Star</option>
                        </select>

                        <button class="btn btn-success w-100">Apply</button>
                    </form>
                </div>

            </div>
        </div>

        <!-- BOOKS -->
        <div class="col-md-9 col-lg-10">
            <div class="row">

                {% for book in books %}
                <div class="col-md-4 mb-4">
                    <div class="card book-card shadow-sm">

                        <img src="{{ book.image_url }}" class="card-img-top">

                        <div class="card-body">
                            <h6>{{ book.title }}</h6>
                            <p class="text-muted">{{ book.genre }}</p>
                            <p>⭐ {{ book.rating }}</p>
                            <p class="text-success">{{ book.price }}</p>
                        </div>

                    </div>
                </div>
                {% endfor %}

            </div>
        </div>

    </div>
</div>

<!-- ✅ Bootstrap JS (IMPORTANT for collapse) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
